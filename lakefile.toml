name = "lean-spectral-theory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Spectral", "SpectralStoneChallenge", "SpectralStoneSolution"]

[leanOptions]
weak.linter.mathlibStandardSet = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Spectral"

[[lean_lib]]
name = "SpectralStoneChallenge"

[[lean_lib]]
name = "SpectralStoneSolution"
